{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Pause - Debug Reset</title>
    <style>
        :root {
            --bg-color: #141a24;
            --panel-bg: #1c2432;
            --text-color: #f0e6d2;
            --text-muted: #a09888;
            --accent-amber: #e5b168;
            --accent-green: #98c379;
            --accent-red: #e06c75;
            --accent-cyan: #56b6c2;
            --border-color: #2c384e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-container {
            width: 600px;
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 12px;
        }

        .header h1 {
            font-size: 1.3rem;
            color: var(--accent-red);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-bar {
            background-color: var(--bg-color);
            padding: 12px 14px;
            border-radius: 4px;
            border-left: 3px solid var(--accent-green);
            font-size: 0.95rem;
            color: var(--accent-green);
        }

        .dialogue-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-color);
        }

        .btn {
            background-color: var(--panel-bg);
            color: var(--accent-amber);
            border: 1px solid var(--accent-amber);
            padding: 10px 20px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: var(--accent-amber);
            color: var(--bg-color);
        }
    </style>
</head>

<body>
    <div class="terminal-container">
        <div class="header">
            <h1>[ DEBUG MODE ] Session Reset</h1>
        </div>

        <div class="status-bar">
            >&nbsp;{{ message|default:"Session has been reset." }}
        </div>

        <div class="dialogue-box">
            <p>All active session data and game progress have been cleared.</p>
            <p style="margin-top: 8px; color: var(--text-muted);">
                Navigating back to the game will start a fresh session.
            </p>
        </div>

        <div style="margin-top: 8px;">
            <a href="{% url 'game_index' %}" class="btn">[ Start New Game ]</a>
        </div>
    </div>
</body>

</html>
